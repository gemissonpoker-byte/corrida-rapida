name: Build APK v8
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q CorridaRapida-Android.zip
      - name: Aplicar versao 8 com Token Temporal de 30 Dias
        run: |
          # Encontra automaticamente a pasta do projeto descompactada
          PROJ=$(find . -maxdepth 1 -type d -not -name '.' -not -name '.*' -not -name 'output_apk' | head -n 1)
          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV
          
          D="$PROJ/app/src/main"
          sed -i 's/versionCode = 1/versionCode = 8/; s/versionName = "1.0"/versionName = "8"/' "$PROJ/app/build.gradle.kts"
          sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' "$D/AndroidManifest.xml"
          
          mkdir -p "$D/res/mipmap-anydpi-v26" "$D/res/drawable" "$D/res/values" "$D/res/xml" "$D/java/com/example/corridarapida"
          
          cat > "$D/res/mipmap-anydpi-v26/ic_launcher.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          # Logo antigo (so o carro), usado apenas como reserva
          cat > "$D/res/drawable/ic_fg_old.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M34,52h40a4,4 0 0 1 4,4v10a4,4 0 0 1 -4,4h-40a4,4 0 0 1 -4,-4v-10a4,4 0 0 1 4,-4z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M39,52L44,40H64L69,52Z"/>
              <path android:fillColor="#1B1B1B" android:pathData="M43,50L46,42H62L65,50Z"/>
              <path android:fillColor="#1B1B1B" android:pathData="M42,63.5m-6.5,0a6.5,6.5 0 1,0 13,0a6.5,6.5 0 1,0 -13,0"/>
              <path android:fillColor="#1B1B1B" android:pathData="M66,63.5m-6.5,0a6.5,6.5 0 1,0 13,0a6.5,6.5 0 1,0 -13,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M42,63.5m-3.5,0a3.5,3.5 0 1,0 7,0a3.5,3.5 0 1,0 -7,0"/>
              <path android:fillColor="#FFFFFF" android:pathData="M66,63.5m-3.5,0a3.5,3.5 0 1,0 7,0a3.5,3.5 0 1,0 -7,0"/>
              <path android:fillColor="#12A150" android:pathData="M74,38m-12,0a12,12 0 1,0 24,0a12,12 0 1,0 -24,0"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3.2" android:strokeLineCap="round" android:strokeLineJoin="round" android:pathData="M68,38.5L72.5,43L80,34"/>
          </vector>
          EOF

          # Logo novo: carro + nome CORRIDA RAPIDA
          mkdir -p "$D/res/drawable-nodpi"
          sudo apt-get install -y -qq fonts-dejavu-core > /dev/null 2>&1 || true
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install -q --break-system-packages pillow 2>/dev/null || python3 -m pip install -q pillow || true
          python3 - "$D/res/drawable-nodpi/ic_fg.png" << 'PY' || true
          from PIL import Image, ImageDraw, ImageFont
          import sys, os
          S = 4
          W = 324 * S
          img = Image.new("RGBA", (W, W), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          def sc(v): return int(v * S)
          WH = (255, 255, 255, 255)
          DK = (27, 27, 27, 255)
          GR = (18, 161, 80, 255)
          cx = 162
          d.rounded_rectangle([sc(cx-52), sc(100), sc(cx+52), sc(128)], radius=sc(9), fill=WH)
          d.polygon([(sc(cx-38), sc(100)), (sc(cx-26), sc(76)), (sc(cx+26), sc(76)), (sc(cx+38), sc(100))], fill=WH)
          d.polygon([(sc(cx-30), sc(97)), (sc(cx-22), sc(81)), (sc(cx+22), sc(81)), (sc(cx+30), sc(97))], fill=DK)
          for x in (cx-30, cx+30):
              d.ellipse([sc(x-15), sc(113), sc(x+15), sc(143)], fill=DK)
              d.ellipse([sc(x-8), sc(120), sc(x+8), sc(136)], fill=WH)
          bx, by, br = cx+38, 82, 22
          d.ellipse([sc(bx-br), sc(by-br), sc(bx+br), sc(by+br)], fill=GR)
          pts = [(bx-10, by+1), (bx-2, by+9), (bx+11, by-8)]
          d.line([(sc(p[0]), sc(p[1])) for p in pts], fill=WH, width=sc(6), joint="curve")
          for p in pts:
              d.ellipse([sc(p[0]-3), sc(p[1]-3), sc(p[0]+3), sc(p[1]+3)], fill=WH)
          FP = None
          for c in ["/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                    "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
                    "/usr/share/fonts/truetype/freefont/FreeSansBold.ttf"]:
              if os.path.exists(c):
                  FP = c
                  break
          def fit(txt, maxw):
              size = 20
              while d.textlength(txt, font=ImageFont.truetype(FP, sc(size + 1))) <= sc(maxw):
                  size += 1
              return ImageFont.truetype(FP, sc(size))
          def line(txt, maxw, yc):
              f = fit(txt, maxw)
              bb = d.textbbox((0, 0), txt, font=f)
              w, h = bb[2] - bb[0], bb[3] - bb[1]
              d.text((sc(162) - w // 2 - bb[0], sc(yc) - h // 2 - bb[1]), txt, font=f, fill=WH)
          line("CORRIDA", 178, 164)
          line("RÁPIDA", 128, 203)
          img.resize((324, 324), Image.Resampling.LANCZOS).save(sys.argv[1], optimize=True)
          PY
          [ -f "$D/res/drawable-nodpi/ic_fg.png" ] || cp "$D/res/drawable/ic_fg_old.xml" "$D/res/drawable/ic_fg.xml"

          cat > "$D/res/values/ic_colors.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_bg">#1B1B1B</color></resources>
          EOF

          cat > "$D/res/values/strings.xml" << 'EOF'
          <resources>
              <string name="app_name">Corrida Rápida v8</string>
              <string name="svc_desc">Lê a oferta de corrida na tela do app de motorista e mostra um veredito flutuante (aceita, limite ou recusa).</string>
          </resources>
          EOF

          cat > "$D/res/xml/accessibility_config.xml" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeWindowsChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:isAccessibilityTool="true"
              android:description="@string/svc_desc"
              android:notificationTimeout="100" />
          EOF

          # MainActivity v8
          cat > "$D/java/com/example/corridarapida/MainActivity.kt" << 'EOF'
          package com.example.corridarapida

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val sp = getSharedPreferences("cfg", MODE_PRIVATE)
                  
                  val expMillis = sp.getLong("exp_millis", 0L)
                  val agora = System.currentTimeMillis()
                  val ativado = expMillis > agora

                  if (!ativado && expMillis > 0) {
                      sp.edit().putBoolean("ativado", false).remove("exp_millis").apply()
                  }

                  val col = LinearLayout(this).apply { 
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48) 
                  }

                  if (!ativado) {
                      col.addView(TextView(this).apply {
                          text = "Ativação do Corrida Rápida v8"
                          textSize = 22f
                          setPadding(0, 0, 0, 24)
                      })
                      col.addView(TextView(this).apply { text = "Insira o token de acesso (30 dias):" })
                      
                      val inputToken = EditText(this).apply {
                          hint = "Ex: CR8-VALIDADE-..."
                          col.addView(this)
                      }

                      col.addView(Button(this).apply {
                          text = "Ativar Aplicativo"
                          setPadding(0, 24, 0, 24)
                          setOnClickListener {
                              val token = inputToken.text.toString().trim()
                              if (token.startsWith("CR8-") || token.isNotEmpty()) {
                                  val cal = Calendar.getInstance()
                                  cal.add(Calendar.DAY_OF_YEAR, 30)
                                  val novaExp = cal.timeInMillis

                                  sp.edit()
                                      .putBoolean("ativado", true)
                                      .putLong("exp_millis", novaExp)
                                      .putString("token", token)
                                      .apply()

                                  Toast.makeText(this@MainActivity, "Ativado com sucesso por 30 dias!", Toast.LENGTH_LONG).show()
                                  recreate()
                              } else {
                                  Toast.makeText(this@MainActivity, "Token inválido!", Toast.LENGTH_SHORT).show()
                              }
                          }
                      })
                  } else {
                      val sdf = SimpleDateFormat("dd/MM/yyyy", Locale.getDefault())
                      val dataExpStr = sdf.format(Date(expMillis))

                      col.addView(TextView(this).apply {
                          text = "Painel de Metas & Limites\n(Ativo até: $dataExpStr)"
                          textSize = 18f
                          setPadding(0, 0, 0, 16)
                      })

                      fun campo(rotulo: String, chave: String, padrao: Float): EditText {
                          col.addView(TextView(this).apply { 
                              text = rotulo
                              setPadding(0, 12, 0, 4)
                          })
                          return EditText(this).apply {
                              inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                              setText(sp.getFloat(chave, padrao).toString())
                              col.addView(this)
                          }
                      }
                      fun ler(e: EditText, d: Float): Float = e.text.toString().replace(",", ".").toFloatOrNull() ?: d

                      val km = campo("Mínimo R$/km", "minKm", 1.8f)
                      val h = campo("Mínimo R$/hora", "minH", 35f)
                      val nota = campo("Nota mínima do passageiro (Estrelas)", "minNota", 4.7f)
                      val emb = campo("Embarque máximo (km)", "maxEmb", 2.0f)

                      col.addView(Button(this).apply {
                          text = "Salvar Metas"
                          setPadding(0, 20, 0, 20)
                          setOnClickListener {
                              sp.edit()
                                  .putFloat("minKm", ler(km, 1.8f))
                                  .putFloat("minH", ler(h, 35f))
                                  .putFloat("minNota", ler(nota, 4.7f))
                                  .putFloat("maxEmb", ler(emb, 2.0f))
                                  .apply()
                              Toast.makeText(this@MainActivity, "Metas Salvas com Sucesso!", Toast.LENGTH_SHORT).show()
                          }
                      })

                      col.addView(TextView(this).apply {
                          text = "\n1. Ative o serviço \"Corrida Rápida v8\" em Acessibilidade.\n2. Abra o app do Uber Driver."
                          setPadding(0, 24, 0, 16)
                      })

                      col.addView(Button(this).apply {
                          text = "Abrir Acessibilidade"
                          setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                      })

                      col.addView(Button(this).apply {
                          text = "Desativar / Trocar Token"
                          setOnClickListener {
                              sp.edit().putBoolean("ativado", false).remove("exp_millis").remove("token").apply()
                              recreate()
                          }
                      })
                  }

                  val sv = ScrollView(this)
                  sv.addView(col)
                  setContentView(sv)
              }
          }
          EOF

          # UberService v8
          cat > "$D/java/com/example/corridarapida/UberService.kt" << 'EOF'
          package com.example.corridarapida

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.TextView

          class UberService : AccessibilityService() {

              private val uber = "com.ubercab.driver"
              private val totalRx = Regex("(\\d+)\\s*min\\w*\\s*[•·]\\s*([\\d.,]+)\\s*km")
              private val trechoRx = Regex("(\\d+)\\s*min\\w*\\s*\\(([\\d.,]+)\\s*km\\)")
              private val precoRx = Regex("R\\$\\s*(\\d+(?:[.,]\\d+)?)")
              private val notaRx = Regex("\\b([1-5][.,]\\d{1,2})\\s*\\(\\d[\\d.,]*\\)")
              private val notaLinhaRx = Regex("^([1-5][.,]\\d{2})$")
              
              private val cinza = Color.rgb(50, 50, 50)
              private val titulos = arrayOf("ACEITA", "LIMITE", "RECUSA")
              private val coresFundo = intArrayOf(
                  Color.parseColor("#E60E6638"),
                  Color.parseColor("#E6B86B00"),
                  Color.parseColor("#E6C62828")
              )
              
              private var cardLayout: LinearLayout? = null
              private var txtVeredito: TextView? = null
              private var txtMetricas: TextView? = null
              private var txtDetalhes: TextView? = null
              
              private var ultimoProcessamento = 0L
              private val handler = Handler(Looper.getMainLooper())
              private var runnableAnalise: Runnable? = null
              private var runnableEsconder: Runnable? = null

              private fun estaAtivo(): Boolean {
                  val sp = getSharedPreferences("cfg", MODE_PRIVATE)
                  val expMillis = sp.getLong("exp_millis", 0L)
                  return expMillis > System.currentTimeMillis()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (!estaAtivo()) return

                  mostrar("v8 · SERVIÇO ATIVO", "Aguardando nova corrida...", "", cinza)
                  handler.postDelayed({
                      if (txtVeredito?.text?.toString()?.contains("SERVIÇO ATIVO") == true) esconder()
                  }, 3000)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent) {
                  if (!estaAtivo()) return

                  val pkg = e.packageName?.toString() ?: return
                  if (pkg == packageName) return
                  if (pkg != uber) { esconder(); return }

                  runnableAnalise?.let { handler.removeCallbacks(it) }
                  runnableAnalise = Runnable { processarTela() }
                  handler.postDelayed(runnableAnalise!!, 100)
              }

              private fun processarTela() {
                  val agora = System.currentTimeMillis()
                  if (agora - ultimoProcessamento < 150) return
                  ultimoProcessamento = agora

                  val sb = StringBuilder()
                  var n = 0
                  val raizes = ArrayList<AccessibilityNodeInfo>()
                  try { windows?.forEach { w -> w.root?.let { raizes.add(it) } } } catch (_: Exception) {}
                  rootInActiveWindow?.let { raizes.add(it) }

                  for (r in raizes) {
                      if (r.packageName?.toString() == uber) n += coletar(r, sb)
                  }

                  analisar(sb.toString().replace('\u00A0', ' ').replace('\u202F', ' '), n)
              }

              private fun coletar(n: AccessibilityNodeInfo?, sb: StringBuilder): Int {
                  if (n == null) return 0
                  var c = 0
                  n.text?.let { sb.append(it).append('\n'); c++ }
                  n.contentDescription?.let { sb.append(it).append('\n'); c++ }
                  for (i in 0 until n.childCount) c += coletar(n.getChild(i), sb)
                  return c
              }

              private fun num(s: String): Double =
                  (if (s.contains(",")) s.replace(".", "").replace(",", ".") else s).toDoubleOrNull() ?: 0.0

              private fun analisar(txt: String, n: Int) {
                  if (n == 0) { tentarEsconderComAtraso(); return }
                  val oferta = txt.contains("R$") && (txt.contains("km") || txt.contains("min"))
                  if (!oferta) { tentarEsconderComAtraso(); return }

                  val linhas = txt.lines().map { it.trim() }
                  val preco = linhas.firstNotNullOfOrNull { l -> precoRx.matchEntire(l)?.groupValues?.get(1) }?.let(::num)
                      ?: linhas.firstOrNull { it.contains("R$") && !it.contains("/km") && !it.startsWith("+") }
                          ?.let { precoRx.find(it)?.groupValues?.get(1) }?.let(::num)

                  val trechos = trechoRx.findAll(txt).toList()
                  val tot = totalRx.find(txt)
                  var min = 0.0
                  var km = 0.0

                  if (tot != null) {
                      min = tot.groupValues[1].toDouble()
                      km = num(tot.groupValues[2])
                  } else if (trechos.size >= 2) {
                      min = trechos.take(2).sumOf { it.groupValues[1].toDouble() }
                      km = trechos.take(2).sumOf { num(it.groupValues[2]) }
                  } else {
                      val kmMatch = Regex("([\\d.,]+)\\s*km").find(txt)
                      val minMatch = Regex("(\\d+)\\s*min").find(txt)
                      if (kmMatch != null && minMatch != null) {
                          km = num(kmMatch.groupValues[1])
                          min = minMatch.groupValues[1].toDouble()
                      }
                  }

                  if (preco == null || preco <= 0 || min <= 0 || km <= 0) {
                      return
                  }

                  val emb: Double? = if (trechos.size >= 2) num(trechos[0].groupValues[2]).takeIf { it > 0 && it < km } else null
                  val nota: Double? = notaRx.find(txt)?.groupValues?.get(1)?.replace(',', '.')?.toDoubleOrNull()
                      ?: linhas.firstNotNullOfOrNull { notaLinhaRx.matchEntire(it)?.groupValues?.get(1) }?.replace(',', '.')?.toDoubleOrNull()

                  val sp = getSharedPreferences("cfg", MODE_PRIVATE)
                  val metaKm = sp.getFloat("minKm", 1.8f)
                  val metaH = sp.getFloat("minH", 35f)
                  val minNota = sp.getFloat("minNota", 4.7f)
                  val maxEmb = sp.getFloat("maxEmb", 2.0f)

                  val rkm = preco / km
                  val rh = preco / (min / 60.0)
                  val okKm = rkm >= metaKm
                  val okH = rh >= metaH
                  val falhaNota = minNota > 0 && nota != null && nota < minNota
                  val falhaEmb = maxEmb > 0 && emb != null && emb > maxEmb

                  var nivel = if (okKm && okH) 0 else if (okKm || okH) 1 else 2
                  if (falhaNota) nivel++
                  if (falhaEmb) nivel++
                  if (nivel > 2) nivel = 2

                  val metricasStr = "R$ %.2f/km  •  R$ %.0f/h".format(rkm, rh)
                  
                  val extras = ArrayList<String>()
                  if (nota != null) extras.add((if (falhaNota) "⚠️ " else "⭐ ") + "%.2f".format(nota))
                  if (emb != null) extras.add((if (falhaEmb) "⚠️ " else "🚗 ") + "Embarque: %.1f km".format(emb))
                  val detalhesStr = extras.joinToString("   ")

                  runnableEsconder?.let { handler.removeCallbacks(it) }
                  mostrar(titulos[nivel], metricasStr, detalhesStr, coresFundo[nivel])
              }

              private fun tentarEsconderComAtraso() {
                  if (cardLayout == null) return
                  runnableEsconder?.let { handler.removeCallbacks(it) }
                  runnableEsconder = Runnable {
                      esconder()
                  }
                  handler.postDelayed(runnableEsconder!!, 600)
              }

              private fun mostrar(veredito: String, metricas: String, detalhes: String, corFundo: Int) {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  
                  if (cardLayout == null) {
                      val context = this
                      cardLayout = LinearLayout(context).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(48, 36, 48, 36)
                          
                          background = GradientDrawable().apply {
                              shape = GradientDrawable.RECTANGLE
                              cornerRadius = 32f
                          }
                          
                          txtVeredito = TextView(context).apply {
                              setTextColor(Color.WHITE)
                              textSize = 26f
                              setTypeface(null, android.graphics.Typeface.BOLD)
                              gravity = Gravity.CENTER
                          }
                          addView(txtVeredito)

                          txtMetricas = TextView(context).apply {
                              setTextColor(Color.WHITE)
                              textSize = 20f
                              setTypeface(null, android.graphics.Typeface.BOLD)
                              gravity = Gravity.CENTER
                              setPadding(0, 10, 0, 6)
                          }
                          addView(txtMetricas)

                          txtDetalhes = TextView(context).apply {
                              setTextColor(Color.parseColor("#F0F0F0"))
                              textSize = 15f
                              gravity = Gravity.CENTER
                          }
                          addView(txtDetalhes)
                      }

                      val lp = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                          PixelFormat.TRANSLUCENT
                      ).apply { 
                          gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                          y = 120 
                      }
                      
                      try {
                          wm.addView(cardLayout, lp)
                      } catch (_: Exception) {}
                  }

                  (cardLayout?.background as? GradientDrawable)?.setColor(corFundo)
                  txtVeredito?.text = veredito
                  txtMetricas?.text = metricas
                  
                  if (detalhes.isNotEmpty()) {
                      txtDetalhes?.text = detalhes
                      txtDetalhes?.visibility = android.view.View.VISIBLE
                  } else {
                      txtDetalhes?.visibility = android.view.View.GONE
                  }
                  
                  cardLayout?.visibility = android.view.View.VISIBLE
              }

              private fun esconder() {
                  handler.removeCallbacksAndMessages(null)
                  cardLayout?.let {
                      try { 
                          (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it) 
                      } catch (_: Exception) {}
                      cardLayout = null
                      txtVeredito = null
                      txtMetricas = null
                      txtDetalhes = null
                  }
              }

              override fun onInterrupt() { esconder() }
              override fun onDestroy() { esconder(); super.onDestroy() }
          }
          EOF
          
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon
      - name: Localizar e Copiar APK
        run: |
          mkdir -p output_apk
          # Procura automaticamente pelo apk gerado em qualquer subpasta de output e copia com o nome v8
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output_apk/CorridaRapida-v8.apk
            echo "APK copiado com sucesso de: $APK_PATH"
          else
            echo "Erro: APK não encontrado!"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CorridaRapida-v8
          path: output_apk/CorridaRapida-v8.apk

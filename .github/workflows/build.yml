name: Build APK v7
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q CorridaRapida-Android.zip
      - name: Aplicar versao 7 com Token e Metas Manuais
        run: |
          D=CorridaRapida/app/src/main
          sed -i 's/versionCode = 1/versionCode = 7/; s/versionName = "1.0"/versionName = "7"/' CorridaRapida/app/build.gradle.kts
          sed -i 's/<application/<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' $D/AndroidManifest.xml
          
          mkdir -p $D/res/mipmap-anydpi-v26 $D/res/drawable$D/res/values $D/res/xml$D/java/com/example/corridarapida
          
          cat > $D/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

